[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "defend-your-pixels"
version = "0.1.0"
description = "AR board game prototype (tracker, bridge, model)"
readme = "README.md"
requires-python = ">=3.10"

# Runtime deps stay in requirements.txt for now; install with:
#   pip install -r requirements.txt
#   pip install -e .

# backend/ holds bridge, live_rules, python_tracker. runner/ is at repo root.
# Do not add "." for backend package names — legacy top-level bridge/ or
# python_tracker/ dirs (only __pycache__) break editable installs.
[tool.setuptools.packages.find]
where = ["backend", "."]
include = ["bridge*", "live_rules*", "python_tracker*", "runner*"]
namespaces = true
