<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prototype4 Sound Preview</title>
<style>
  body { background: #1a120a; color: #f0e0c0; font-family: monospace; padding: 32px; }
  h1   { color: #e8c030; margin-bottom: 8px; }
  p    { color: #8a7060; margin-bottom: 28px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; max-width: 700px; }
  button {
    background: #2a1c0e; border: 2px solid #5a3e1e; color: #f0e0c0;
    padding: 18px 10px; border-radius: 8px; cursor: pointer;
    font-family: monospace; font-size: 13px; font-weight: bold;
    transition: background 0.1s, border-color 0.1s;
  }
  button:hover  { background: #3a2c1e; border-color: #e8c030; }
  button:active { background: #e8c030; color: #1a120a; }
  .label  { font-size: 11px; color: #8a7060; margin-top: 5px; }
  .desc   { font-size: 10px; color: #5a4030; margin-top: 3px; }
</style>
</head>
<body>
<h1>🔊 Prototype4 Sound Preview</h1>
<p>Click a button to hear each synthesized sound. Use these as a reference when searching for replacement assets.</p>
<div class="grid" id="btns"></div>

<script>
const SOUNDS = [
  { key: "place",       emoji: "🪙", name: "Place Token",    desc: "Low thud on drop" },
  { key: "rotate",      emoji: "🔄", name: "Rotate",         desc: "Short mechanical click" },
  { key: "shoot",       emoji: "🔫", name: "Shoot",          desc: "Rifle crack + low thump" },
  { key: "hit",         emoji: "💥", name: "Territory Hit",  desc: "Heavy low-freq impact" },
  { key: "terrain_hit", emoji: "🪨", name: "Terrain Hit",    desc: "Stone / wood crack" },
  { key: "shield",      emoji: "🛡️", name: "Shield Block",   desc: "Metallic deflection ping" },
  { key: "explosion",   emoji: "💣", name: "Base Destroyed", desc: "Deep rumbling explosion" },
  { key: "miss",        emoji: "〰️", name: "Miss",           desc: "Descending whoosh" },
];

let ctx = null;
function getCtx() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}

function playSound(type) {
  const ctx = getCtx();
  const t = ctx.currentTime;

  switch (type) {
    case "rotate": {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = "square";
      osc.frequency.setValueAtTime(520, t);
      osc.frequency.exponentialRampToValueAtTime(140, t + 0.055);
      gain.gain.setValueAtTime(0.22, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
      osc.start(t); osc.stop(t + 0.06); break;
    }
    case "place": {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = "sine";
      osc.frequency.setValueAtTime(220, t);
      osc.frequency.exponentialRampToValueAtTime(70, t + 0.09);
      gain.gain.setValueAtTime(0.45, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
      osc.start(t); osc.stop(t + 0.12); break;
    }
    case "shoot": {
      const dur = 0.18, rate = ctx.sampleRate;
      const buf = ctx.createBuffer(1, Math.ceil(rate * dur), rate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++)
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2.2);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const bpf = ctx.createBiquadFilter(); bpf.type = "bandpass"; bpf.frequency.value = 1800; bpf.Q.value = 0.8;
      const gn = ctx.createGain();
      gn.gain.setValueAtTime(1.0, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(bpf); bpf.connect(gn); gn.connect(ctx.destination);
      src.start(t); src.stop(t + dur);
      const osc = ctx.createOscillator(), gn2 = ctx.createGain();
      osc.connect(gn2); gn2.connect(ctx.destination);
      osc.type = "sine";
      osc.frequency.setValueAtTime(130, t); osc.frequency.exponentialRampToValueAtTime(35, t + 0.12);
      gn2.gain.setValueAtTime(0.65, t); gn2.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      osc.start(t); osc.stop(t + 0.14); break;
    }
    case "hit": {
      const dur = 0.28, rate = ctx.sampleRate;
      const buf = ctx.createBuffer(1, Math.ceil(rate * dur), rate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++)
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 1.6);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const lpf = ctx.createBiquadFilter(); lpf.type = "lowpass"; lpf.frequency.value = 380;
      const gn = ctx.createGain();
      gn.gain.setValueAtTime(1.3, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(lpf); lpf.connect(gn); gn.connect(ctx.destination);
      src.start(t); src.stop(t + dur); break;
    }
    case "shield": {
      [[1800, 0.45], [2700, 0.22]].forEach(([freq, vol]) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, t); osc.frequency.exponentialRampToValueAtTime(freq * 0.35, t + 0.32);
        gain.gain.setValueAtTime(vol, t); gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
        osc.start(t); osc.stop(t + 0.33);
      }); break;
    }
    case "terrain_hit": {
      const dur = 0.16, rate = ctx.sampleRate;
      const buf = ctx.createBuffer(1, Math.ceil(rate * dur), rate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++)
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2.8);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const bpf = ctx.createBiquadFilter(); bpf.type = "bandpass"; bpf.frequency.value = 700; bpf.Q.value = 1.4;
      const gn = ctx.createGain();
      gn.gain.setValueAtTime(0.9, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(bpf); bpf.connect(gn); gn.connect(ctx.destination);
      src.start(t); src.stop(t + dur); break;
    }
    case "explosion": {
      const dur = 0.85, rate = ctx.sampleRate;
      const buf = ctx.createBuffer(1, Math.ceil(rate * dur), rate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++)
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 1.1);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const lpf = ctx.createBiquadFilter(); lpf.type = "lowpass"; lpf.frequency.value = 180;
      const gn = ctx.createGain();
      gn.gain.setValueAtTime(1.6, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(lpf); lpf.connect(gn); gn.connect(ctx.destination);
      src.start(t); src.stop(t + dur);
      const osc = ctx.createOscillator(), gn2 = ctx.createGain();
      osc.connect(gn2); gn2.connect(ctx.destination);
      osc.type = "sine";
      osc.frequency.setValueAtTime(90, t); osc.frequency.exponentialRampToValueAtTime(18, t + 0.6);
      gn2.gain.setValueAtTime(1.1, t); gn2.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      osc.start(t); osc.stop(t + 0.6); break;
    }
    case "miss": {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(550, t); osc.frequency.exponentialRampToValueAtTime(90, t + 0.22);
      gain.gain.setValueAtTime(0.14, t); gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      osc.start(t); osc.stop(t + 0.23); break;
    }
  }
}

// Build buttons
const grid = document.getElementById("btns");
SOUNDS.forEach(s => {
  const wrap = document.createElement("div");
  const btn  = document.createElement("button");
  btn.innerHTML = `${s.emoji}<br>${s.name}`;
  btn.onclick = () => playSound(s.key);
  const desc = document.createElement("div");
  desc.className = "desc"; desc.textContent = s.desc;
  wrap.appendChild(btn); wrap.appendChild(desc);
  grid.appendChild(wrap);
});
</script>
</body>
</html>
