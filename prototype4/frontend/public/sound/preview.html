<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sound Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    color: #ffffff;
    background-image: url('board1.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(20, 10, 4, 0.72);
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 44px 28px;
  }

  h1 {
    color: #ffffff;
    font-size: 22px;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .subtitle {
    color: #ccbbaa;
    font-size: 12px;
    margin-bottom: 40px;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ccbbaa;
    border-bottom: 1px solid #3a2810;
    padding-bottom: 8px;
    margin-bottom: 18px;
    margin-top: 36px;
  }

  .grid   { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }

  .card {
    background: rgba(26, 18, 10, 0.85);
    border: 1px solid #3a2810;
    border-radius: 10px;
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .card img {
    width: 90px;
    height: 90px;
    object-fit: contain;
  }

  .card-name {
    font-size: 13px;
    font-weight: bold;
    text-align: center;
    color: #ffffff;
    line-height: 1.6;
  }

  .card-file {
    font-size: 9px;
    color: #8a7060;
  }

  button {
    background: #2a1c0e;
    border: 1.5px solid #5a3e1e;
    color: #ffffff;
    padding: 9px 0;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    transition: background 0.1s, border-color 0.1s;
    width: 100%;
  }

  button:hover        { background: #3a2c1e; border-color: #e8c030; }
  button.playing      { background: #4a2010; border-color: #ff6020; color: #ff9060; }
  button.playing:hover{ background: #5a2818; }

  /* BGM */
  .bgm-card {
    background: rgba(26, 18, 10, 0.85);
    border: 1px solid #3a2810;
    border-radius: 10px;
    padding: 22px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .bgm-info { flex: 1; }
  .bgm-label  { font-size: 14px; color: #ffffff; margin-bottom: 6px; }
  .bgm-file   { font-size: 9px; color: #8a7060; margin-bottom: 6px; }
  .bgm-status { font-size: 10px; color: #ccbbaa; }

  .bgm-controls { display: flex; gap: 10px; }
  .bgm-controls button { width: 110px; }
</style>
</head>
<body>
<div class="container">

  <h1>Sound Preview</h1>
  <p class="subtitle">Pixel Defense — Emu War</p>

  <!-- ── Turn Triggers ── -->
  <div class="section-label">Turn Triggers</div>
  <div class="grid-2">
    <div class="card">
      <img src="atk-mick.png" alt="Old Mick">
      <div class="card-name">Old Mick's Turn</div>
      <div class="card-file">mick_trigger.mp3</div>
      <button id="btn-mick_trigger" onclick="toggle('mick_trigger')">▶ Play</button>
    </div>
    <div class="card">
      <img src="atk-emu.png" alt="The Mob">
      <div class="card-name">The Mob's Turn</div>
      <div class="card-file">emu_trigger.mp3</div>
      <button id="btn-emu_trigger" onclick="toggle('emu_trigger')">▶ Play</button>
    </div>
  </div>

  <!-- ── Shared SFX ── -->
  <div class="section-label">Shared SFX</div>
  <div class="grid">
    <div class="card">
      <div class="card-name">Token Action</div>
      <div class="card-file">Place / Move / Rotate</div>
      <button onclick="playSineClick()">▶ Play</button>
    </div>
    <div class="card">
      <div class="card-name">Victory</div>
      <div class="card-file">win.mp3</div>
      <button id="btn-win" onclick="toggle('win')">▶ Play</button>
    </div>
    <div class="card">
      <div class="card-name">Upgrade</div>
      <div class="card-file">level_up.mp3</div>
      <button id="btn-level_up" onclick="toggle('level_up')">▶ Play</button>
    </div>
    <div class="card">
      <div class="card-name">Intro</div>
      <div class="card-file">intro.wav</div>
      <button id="btn-intro" onclick="toggle('intro')">▶ Play</button>
    </div>
  </div>

  <!-- ── Background Music ── -->
  <div class="section-label">Background Music</div>
  <div class="bgm-card">
    <div class="bgm-info">
      <div class="bgm-label">BGM</div>
      <div class="bgm-file">bgm.mp3</div>
      <div class="bgm-status" id="bgm-status">Stopped</div>
    </div>
    <div class="bgm-controls">
      <button id="btn-bgm" onclick="toggleBgm()">▶ Play</button>
    </div>
  </div>

</div>

<script>
// Synthesized sine click — 523 Hz, 0.12s
const _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSineClick() {
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  const t    = _audioCtx.currentTime;
  const osc  = _audioCtx.createOscillator();
  const gain = _audioCtx.createGain();
  osc.connect(gain); gain.connect(_audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(523, t);
  gain.gain.setValueAtTime(0.20, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  osc.start(t); osc.stop(t + 0.13);
}

const SOUNDS = {
  mick_trigger: new Audio('sounds/mick_trigger.mp3'),
  emu_trigger:  new Audio('sounds/emu_trigger.mp3'),
  win:          new Audio('sounds/win.mp3'),
  level_up:     new Audio('sounds/level_up.mp3'),
  intro:        new Audio('sounds/intro.wav'),
};

const BGM = new Audio('sounds/bgm.mp3');
BGM.loop = true;

// Track which sfx is currently playing
let currentKey = null;

function toggle(key) {
  const audio = SOUNDS[key];
  const btn   = document.getElementById(`btn-${key}`);

  // If this one is already playing — pause it
  if (currentKey === key && !audio.paused) {
    audio.pause();
    btn.textContent = '▶ Play';
    btn.classList.remove('playing');
    currentKey = null;
    return;
  }

  // Stop whatever was playing before
  if (currentKey && SOUNDS[currentKey]) {
    SOUNDS[currentKey].pause();
    SOUNDS[currentKey].currentTime = 0;
    const prev = document.getElementById(`btn-${currentKey}`);
    if (prev) { prev.textContent = '▶ Play'; prev.classList.remove('playing'); }
  }

  // Play new one
  audio.currentTime = 0;
  audio.play();
  btn.textContent = '❚❚ Pause';
  btn.classList.add('playing');
  currentKey = key;

  audio.onended = () => {
    btn.textContent = '▶ Play';
    btn.classList.remove('playing');
    if (currentKey === key) currentKey = null;
  };
}

function toggleBgm() {
  const btn = document.getElementById('btn-bgm');
  if (BGM.paused) {
    BGM.play();
    btn.textContent = '❚❚ Pause';
    btn.classList.add('playing');
    document.getElementById('bgm-status').textContent = 'Playing…';
  } else {
    BGM.pause();
    btn.textContent = '▶ Play';
    btn.classList.remove('playing');
    document.getElementById('bgm-status').textContent = 'Paused';
  }
}

BGM.addEventListener('ended', () => {
  document.getElementById('bgm-status').textContent = 'Stopped';
  const btn = document.getElementById('btn-bgm');
  btn.textContent = '▶ Play';
  btn.classList.remove('playing');
});
</script>
</body>
</html>
