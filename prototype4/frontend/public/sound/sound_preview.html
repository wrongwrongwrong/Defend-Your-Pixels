<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sound Engine Preview</title>
<style>
  body { background: #1a120a; color: #f0e0c0; font-family: monospace; padding: 32px; }
  h1   { color: #e8c030; margin-bottom: 8px; }
  p    { color: #8a7060; margin-bottom: 28px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; max-width: 700px; }
  button {
    background: #2a1c0e; border: 2px solid #5a3e1e; color: #f0e0c0;
    padding: 18px 10px; border-radius: 8px; cursor: pointer;
    font-family: monospace; font-size: 13px; font-weight: bold;
    transition: background 0.1s, border-color 0.1s;
  }
  button:hover  { background: #3a2c1e; border-color: #e8c030; }
  button:active { background: #e8c030; color: #1a120a; }
  .desc { font-size: 10px; color: #5a4030; margin-top: 3px; }
</style>
</head>
<body>
<h1>🔊 Sound Engine Preview</h1>
<p>Click a button to hear each synthesized sound. Use these as a reference when searching for replacement assets.</p>
<div class="grid" id="btns"></div>

<script>
class SoundEngine {
  constructor() {
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { this.ctx = null; }
  }

  _osc(type, freq, startT, dur, vol, freqEnd) {
    if (!this.ctx) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const t   = this.ctx.currentTime + startT;
    const osc = this.ctx.createOscillator();
    const g   = this.ctx.createGain();
    osc.connect(g); g.connect(this.ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.start(t); osc.stop(t + dur + 0.01);
  }

  place()  { this._osc('sine',     523, 0,    0.12, 0.20); }
  lock()   { [523, 659, 784].forEach((f, i) => this._osc('sine', f, i * 0.10, 0.14, 0.25)); }
  fire()   { this._osc('sawtooth', 300, 0,    0.25, 0.35, 55); }
  hit()    { this._osc('square',   120, 0,    0.40, 0.45, 35); }
  block()  { this._osc('square',   250, 0,    0.18, 0.30, 80); }
  nuke()   { this._osc('sawtooth', 110, 0,    1.20, 0.60, 20);
             this._osc('sine',      55, 0,    1.50, 0.40, 18); }
  turn()   { this._osc('sine',     660, 0,    0.12, 0.18);
             this._osc('sine',     880, 0.12, 0.10, 0.14); }
}

const SFX = new SoundEngine();

const SOUNDS = [
  { key: "place", emoji: "🪙", name: "Place / Rotate",  desc: "Short sine click — token placed or rotated" },
  { key: "lock",  emoji: "🔒", name: "Lock",            desc: "Three rising tones — terrain confirmed" },
  { key: "fire",  emoji: "🔫", name: "Fire",            desc: "Descending sawtooth — rifle / emu fires" },
  { key: "hit",   emoji: "💥", name: "Hit",             desc: "Low square thud — attack lands" },
  { key: "block", emoji: "🪨", name: "Block",           desc: "Square wave — blocked by hard terrain" },
  { key: "nuke",  emoji: "💣", name: "Nuke",            desc: "Deep rumble — base destroyed" },
  { key: "turn",  emoji: "🔔", name: "Turn Change",     desc: "Two-tone chime — next player's turn" },
];

const grid = document.getElementById("btns");
SOUNDS.forEach(s => {
  const wrap = document.createElement("div");
  const btn  = document.createElement("button");
  btn.innerHTML = `${s.emoji}<br>${s.name}`;
  btn.onclick = () => SFX[s.key]();
  const desc = document.createElement("div");
  desc.className = "desc"; desc.textContent = s.desc;
  wrap.appendChild(btn); wrap.appendChild(desc);
  grid.appendChild(wrap);
});
</script>
</body>
</html>
