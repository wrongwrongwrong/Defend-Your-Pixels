<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutorial Prompt</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Georgia, serif;
      background: #1a1008;
      color: #fff0b0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.35);
    }

    .modal-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .modal {
      width: min(560px, 92vw);
      border-radius: 14px;
      background: #2a2010;
      border: 2px solid #6a4a20;
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.45);
      padding: 22px 18px 18px 18px;
      text-align: center;
    }

    .modal h1 {
      font-size: 20px;
      margin: 0 0 10px 0;
      color: #ffe070;
      letter-spacing: 0.2px;
    }

    .modal p {
      margin: 0 0 18px 0;
      font-size: 16px;
      color: #f2d8a0;
    }

    .btn-row {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: #fff8dc;
      background: #402318;
      transition: transform 0.05s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .yes {
      background: #5c3414;
      border: 1px solid rgba(255, 216, 120, 0.45);
    }

    .no {
      background: #294016;
      border: 1px solid rgba(184, 255, 120, 0.35);
    }

    .hint {
      font-size: 13px;
      color: #9a7a58;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="overlay" role="dialog" aria-modal="true" aria-label="Tutorial prompt">
    <div class="modal-wrap">
      <div class="modal">
        <h1>Old Mick Against the Mob</h1>
        <p>Do you wish to play the tutorial?</p>
        <div class="btn-row">
          <button class="yes" id="btnYes" type="button">Yes</button>
          <button class="no" id="btnNo" type="button">No</button>
        </div>
      </div>
      <div class="hint" id="pressAnyKeyHint">press any key to continue</div>
    </div>
  </div>

  <script>
    const tutorialUrl = "./Tutorial.html";
    const homeUrl = "./index.html";

    const hint = document.getElementById("pressAnyKeyHint");
    const btnYes = document.getElementById("btnYes");
    const btnNo = document.getElementById("btnNo");

    // "Segway" convenience: any key hides the hint (buttons still decide redirect).
    document.addEventListener(
      "keydown",
      () => {
        if (hint) hint.style.display = "none";
      },
      { once: true }
    );

    btnYes.addEventListener("click", () => {
      window.location.href = tutorialUrl;
    });

    btnNo.addEventListener("click", () => {
      window.location.href = homeUrl;
    });
  </script>
</body>
</html>
